<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINova · 11月25 更新预览</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="web/misans/MiSansVF.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0A0A12;
    --soft:rgba(10,10,18,.52);
    --faint:rgba(10,10,18,.30);
    --line:rgba(10,10,18,.13);
    --bg:#FAF9FD;
  }
  html{scroll-behavior:smooth;scroll-snap-type:y proximity;background:var(--bg)}
  body{
    background:transparent;color:var(--ink);
    font-family:'MiSans VF','MiSans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ================= 动态背景 ================= */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .sky i{position:absolute;display:block;border-radius:50%;will-change:transform}
  .sky .b1{width:78vw;height:78vw;left:-30vw;top:-34vw;
    background:radial-gradient(circle,rgba(255,150,172,.46) 0%,rgba(255,150,172,.16) 42%,rgba(255,150,172,0) 68%);
    animation:d1 24s ease-in-out infinite}
  .sky .b2{width:66vw;height:66vw;right:-26vw;top:-22vw;
    background:radial-gradient(circle,rgba(124,166,255,.46) 0%,rgba(124,166,255,.15) 42%,rgba(124,166,255,0) 68%);
    animation:d2 31s ease-in-out infinite}
  .sky .b3{width:60vw;height:60vw;right:-18vw;bottom:-26vw;
    background:radial-gradient(circle,rgba(186,146,255,.42) 0%,rgba(186,146,255,.14) 42%,rgba(186,146,255,0) 68%);
    animation:d3 37s ease-in-out infinite}
  .sky .b4{width:54vw;height:54vw;left:-18vw;bottom:-22vw;
    background:radial-gradient(circle,rgba(255,198,138,.42) 0%,rgba(255,198,138,.14) 42%,rgba(255,198,138,0) 68%);
    animation:d4 28s ease-in-out infinite}
  @keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,5vh,0) scale(1.14)}}
  @keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-7vw,6vh,0) scale(.94)}}
  @keyframes d3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-6vw,-5vh,0) scale(1.16)}}
  @keyframes d4{0%,100%{transform:translate3d(0,0,0) scale(1.08)}50%{transform:translate3d(6vw,-6vh,0) scale(.96)}}

  /* 斜扫光带 */
  .sky .band{position:absolute;top:-40vh;left:-60vw;width:44vw;height:180vh;
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,178,196,.20) 26%,
      rgba(206,190,255,.26) 48%,
      rgba(160,200,255,.20) 68%,
      rgba(255,255,255,0) 100%);
    transform:rotate(-14deg);animation:sweep 13s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes sweep{
    0%{transform:translate3d(0,0,0) rotate(-14deg);opacity:0}
    12%{opacity:1}
    72%{opacity:1}
    100%{transform:translate3d(190vw,0,0) rotate(-14deg);opacity:0}
  });
  vio.observe(v);
})();
</script>
</body>
</html>
